name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Offline evals
        run: uv run python -m evals.run --json eval-results.json
      - name: Demo (stub model, end to end)
        run: uv run python -m examples.demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.python }}
          path: eval-results.json
